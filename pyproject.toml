[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonehome"
version = "0.1.0"
description = "Does your self-hosted app phone home? Verified registry of telemetry and opt-outs, blocklists, and a docker-compose audit."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
phonehome = "phonehome.cli:main"
phonehome-mcp = "phonehome.mcp_server:main"

[project.urls]
Homepage = "https://github.com/12burb/phonehome"

[tool.setuptools]
packages = ["phonehome"]

[tool.setuptools.package-data]
phonehome = []
