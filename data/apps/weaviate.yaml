id: weaviate
name: Weaviate
category: Database
repo: https://github.com/weaviate/weaviate
images:
- semitechnologies/weaviate
- cr.weaviate.io/semitechnologies/weaviate
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.weaviate.io
  sends: Telemetry UPDATE payload (version, object counts, modules); also fetches the startup banner from weaviate.io
  frequency: every 24h
  optout:
    env:
    - DISABLE_TELEMETRY=true
  sources:
  - https://weaviate.io/developers/weaviate/config-refs/env-vars
verified: '2026-11-14'
