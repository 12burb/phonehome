id: timescaledb
name: TimescaleDB
category: Database
repo: https://github.com/timescale/timescaledb
images:
- timescale/timescaledb
- timescale/timescaledb-ha
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.timescale.com
  sends: Version, OS, hypertable counts, feature usage; also used for version checking
  frequency: daily
  optout:
    config: timescaledb.telemetry_level=off in postgresql.conf (or ALTER SYSTEM SET timescaledb.telemetry_level=off)
  sources:
  - https://raw.githubusercontent.com/timescale/docs/latest/self-hosted/configuration/telemetry.md
verified: '2026-11-14'
