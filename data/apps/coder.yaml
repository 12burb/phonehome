id: coder
name: Coder
category: Dev tooling
repo: https://github.com/coder/coder
images:
- ghcr.io/coder/coder
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.coder.com
  sends: Anonymized usage data
  frequency: periodic
  optout:
    env:
    - CODER_TELEMETRY_ENABLE=false
    cli: --telemetry=false
    config: 'telemetry.enable: false'
  sources:
  - https://coder.com/docs/reference/cli/server
verified: '2026-11-14'
