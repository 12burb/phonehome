id: influxdb
name: InfluxDB 2.x
category: Database
repo: https://github.com/influxdata/influxdb
images:
- influxdb
verified: '2026-11-20'
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.influxdata.com
  sends: Usage telemetry (version, OS, counts of buckets/users, query stats) per the InfluxData telemetry page
  frequency: periodic
  optout:
    env:
    - INFLUXD_REPORTING_DISABLED=true
    cli: influxd --reporting-disabled
    config: 'reporting-disabled: true'
  sources:
  - https://raw.githubusercontent.com/influxdata/docs-v2/master/content/influxdb/v2/reference/config-options.md
