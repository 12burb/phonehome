id: hasura
name: Hasura GraphQL Engine
category: Database
repo: https://github.com/hasura/graphql-engine
images:
- hasura/graphql-engine
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.hasura.io
  sends: Counts of tables, views, relationships, permissions, triggers, remote schemas plus random instance/db UUIDs and version
  frequency: periodic
  optout:
    env:
    - HASURA_GRAPHQL_ENABLE_TELEMETRY=false
    cli: --enable-telemetry=false
  sources:
  - https://hasura.io/docs/2.0/policies/telemetry/
verified: '2026-11-14'
