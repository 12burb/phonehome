id: meilisearch
name: Meilisearch
category: Search
repo: https://github.com/meilisearch/meilisearch
images:
- getmeili/meilisearch
calls:
- type: telemetry
  default: 'on'
  destinations:
  - telemetry.meilisearch.com
  - api.segment.io
  sends: Anonymized usage data via Segment (instance UUID, version, index/document counts, feature usage)
  frequency: hourly
  optout:
    env:
    - MEILI_NO_ANALYTICS=true
    cli: --no-analytics
  sources:
  - https://www.meilisearch.com/docs/learn/resources/telemetry
verified: '2026-11-14'
