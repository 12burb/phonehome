id: piwigo
name: Piwigo
category: Photos
repo: https://github.com/Piwigo/Piwigo
images:
- lscr.io/linuxserver/piwigo
verified: '2026-11-20'
calls:
- type: update_check
  default: 'on'
  destinations:
  - piwigo.org
  block: false
  sends: Fetches piwigo.org/download/all_versions.php (with a random cache-buster) to compare against the installed version;
    no instance data in the request
  frequency: every 24 h, only when the gallery is visited
  optout:
    config: $conf['update_notify_check_period'] = 0; in local/config/config.inc.php
  sources:
  - https://raw.githubusercontent.com/Piwigo/Piwigo/master/include/config_default.inc.php
  - https://github.com/Piwigo/Piwigo/blob/master/include/page_tail.php
  - https://github.com/Piwigo/Piwigo/blob/master/admin/include/updates.class.php
