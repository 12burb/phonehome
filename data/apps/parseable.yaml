id: parseable
name: Parseable
category: Logging
repo: https://github.com/parseablehq/parseable
images:
- parseable/parseable
- containers.parseable.com/parseable/parseable
verified: '2026-11-20'
calls:
- type: telemetry
  default: 'on'
  destinations:
  - analytics.parseable.io
  sends: Anonymous deployment id, version, OS, stream and ingestion statistics
  frequency: hourly
  optout:
    env:
    - P_SEND_ANONYMOUS_USAGE_DATA=false
    cli: --send-analytics=false
  sources:
  - https://raw.githubusercontent.com/parseablehq/parseable/main/src/cli.rs
  - https://raw.githubusercontent.com/parseablehq/parseable/main/src/analytics.rs
- type: update_check
  default: 'on'
  destinations:
  - download.parseable.io
  sends: Version for the release check
  frequency: periodic
  optout:
    env:
    - P_CHECK_UPDATE=false
    cli: --check-update=false
  sources:
  - https://raw.githubusercontent.com/parseablehq/parseable/main/src/cli.rs
