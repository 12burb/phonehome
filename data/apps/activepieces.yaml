id: activepieces
name: Activepieces
category: Automation
repo: https://github.com/activepieces/activepieces
images:
- activepieces/activepieces
- ghcr.io/activepieces/activepieces
calls:
- type: telemetry
  default: 'on'
  destinations:
  - app.posthog.com
  sends: Product analytics
  frequency: continuous
  optout:
    env:
    - AP_TELEMETRY_ENABLED=false (only read on first start)
    ui: Platform Admin > Account > Configurations
  sources:
  - https://www.activepieces.com/docs/install/configuration/environment-variables
verified: '2026-11-14'
