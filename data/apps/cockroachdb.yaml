id: cockroachdb
name: CockroachDB
category: Database
repo: https://github.com/cockroachdb/cockroach
images:
- cockroachdb/cockroach
calls:
- type: telemetry
  default: 'on'
  destinations:
  - register.cockroachdb.com
  sends: 'Diagnostics: cluster/node metadata, scrubbed statements, feature usage'
  frequency: hourly
  optout:
    env:
    - COCKROACH_SKIP_ENABLING_DIAGNOSTIC_REPORTING=true (at init)
    config: SET CLUSTER SETTING diagnostics.reporting.enabled = false;
  sources:
  - https://www.cockroachlabs.com/docs/stable/diagnostics-reporting
notes: Cannot be disabled on Enterprise Trial / Enterprise Free licenses.
verified: '2026-11-14'
