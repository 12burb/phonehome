id: yugabytedb
name: YugabyteDB
category: Database
repo: https://github.com/yugabyte/yugabyte-db
images:
- yugabytedb/yugabyte
verified: '2026-11-20'
calls:
- type: telemetry
  default: 'on'
  destinations:
  - diagnostics.yugabyte.com
  sends: '"Callhome" analytics: cluster/node ids, version, hardware, table/tablet counts and metrics'
  frequency: hourly (callhome_interval_secs=3600)
  optout:
    cli: --callhome_enabled=false on yb-master and yb-tserver (or yugabyted --master_flags/--tserver_flags)
  sources:
  - https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/src/yb/server/call_home.cc
